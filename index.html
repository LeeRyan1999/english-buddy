<!doctype html>
<html lang="zh-Hant-TW"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="英語夥伴">
<title>英語夥伴 English Buddy</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3"><link rel="icon" href="icon-192.png?v=3">
<link rel="stylesheet" href="style.css?v=12">
</head><body>
<header id="top"><button id="scenBtn" class="chip">☕ 閒聊 · 中級</button><div id="status" class="pill"></div></header>
<nav id="tabs" class="hidden"><button data-tab="voice" class="on">語音</button><button data-tab="settings">設定</button></nav>
<section id="voice" class="tab on">
  <canvas id="orb"></canvas>
  <div id="vState" aria-live="polite">點一下開始</div>
  <div id="vLog"></div>
  <div id="fixToast" class="hidden"></div>
  <div id="controls">
    <button id="vMute" class="ib" aria-label="靜音"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M4 4l16 16"/></svg></button>
    <button id="vCap" class="ib" aria-label="字幕"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.5a2 2 0 1 0 0 3M16 10.5a2 2 0 1 0 0 3"/></svg></button>
    <button id="vDict" class="ib" aria-label="查單字"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button>
    <button id="vSet" class="ib" aria-label="設定"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    <button id="vMain" class="ib main" aria-label="開始"><span class="go">開始</span><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</section>
<section id="settings" class="tab"><div class="row" style="align-items:center"><button id="sBack">‹ 回到語音</button></div>
  <h3>對話</h3>
  <label>情境<select id="sScen"><option value="order">🍔 點餐</option><option value="travel">✈️ 旅遊/機場</option><option value="interview">💼 面試</option><option value="shopping">🛍️ 購物</option><option value="chat" selected>☕ 閒聊</option></select></label>
  <label>程度<select id="sLvl"><option value="beginner">初級</option><option value="intermediate" selected>中級</option><option value="advanced">高級</option></select></label>
  <label>AI 聲音<select id="sVoice"></select></label>
  <label>說話速度<select id="sSpeed"><option value="normal">正常</option><option value="slow">慢一點</option></select></label>
  <div class="row"><button id="vClear">清除對話紀錄</button></div>
  <h3>連線</h3>
  <label>後台網址<input id="sUrl" autocapitalize="off"></label>
  <label>存取碼<input id="sCode" type="password" autocomplete="off"></label>
  <label class="chk"><input type="checkbox" id="sTrMe"> 翻譯我說的話</label>
  <label class="chk"><input type="checkbox" id="sTrAI"> 翻譯 AI 的話</label>
  <label class="chk"><input type="checkbox" id="sMock"> 示範模式（不連後台，用假資料測試介面）</label>
  <div class="row"><button class="pri" id="sSave">儲存</button><button id="sTest">測試連線</button></div>
  <div id="sOut" class="small"></div>
  <p class="small dim">設定只存在這台裝置。戴耳機效果最好；說話時可直接打斷 AI。點字幕裡的英文單字可看解釋並加入 Notion。</p>
</section>
<div id="sheet" class="sheet hidden"><div class="sheetIn" id="sheetIn"></div></div>
<script src="app.js?v=12"></script>
</body></html>
